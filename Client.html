<script>
  /* ===== 貯蔵品購入申請 リデザイン（B案「ゆとり」）クライアント ===== */

  const state = {
    bootstrap: null,
    counts: { pending: 0, president: 0, quote: 0, supervisor: 0, gm: 0, arrange: 0 },
    view: 'formView',
    listMode: 'supervisor',
    currentDetail: null
  };

  const STEP_DESC = {
    APPLICANT: '申請内容の作成',
    SUPERVISOR: '上席確認',
    PURCHASING_QUOTE: '見積・金額入力',
    GENERAL_MANAGER: '部門承認',
    PRESIDENT: '社長決裁',
    PURCHASING: '発注手配'
  };
  const HIST_GLYPH = { SUBMIT: '➤', RESUBMIT: '➤', APPROVE: '✓', RETURN: '‹', COMPLETE: '✓', UPDATE: '✎', PDF_GENERATE: '⤓', ESCALATE: '⤴' };
  const NG_REASONS = ['金額が過大', '用途・必要性が不明確', '見積書の添付が必要', '時期尚早・要再検討', '他部署と要調整'];

  const TAB_DEFS = [
    { key: 'form', view: 'formView', label: '新規申請' },
    { key: 'supervisor', view: 'listView', mode: 'supervisor', label: '上席承認待ち', countKey: 'supervisor' },
    { key: 'quote', view: 'listView', mode: 'quote', label: '金額入力待ち', countKey: 'quote' },
    { key: 'gm', view: 'listView', mode: 'gm', label: '総務部長承認待ち', countKey: 'gm' },
    { key: 'president', view: 'listView', mode: 'president', label: '社長承認待ち', countKey: 'president' },
    { key: 'arrange', view: 'listView', mode: 'arrange', label: '手配待ち', countKey: 'arrange' },
    { key: 'all', view: 'listView', mode: 'all', label: '全申請', admin: true },
    { key: 'admin', view: 'adminView', label: '管理', admin: true }
  ];

  const formState = { editingId: '', requestDate: '', applicantName: '', department: '', reasonCode: '', reasonDetail: '', items: [] };

  document.addEventListener('DOMContentLoaded', initialize);

  async function initialize() {
    setBusy(true);
    try {
      state.bootstrap = await gas('getBootstrap');
      renderTopbar();
      await refreshCounts();
      renderTabs();
      showView('formView');
      if (window.INITIAL_REQUEST_ID) {
        await openDetail(window.INITIAL_REQUEST_ID);
      }
    } catch (error) {
      toast(errText(error), 'err');
    } finally {
      setBusy(false);
    }
  }

  /* ---------- Topbar / Tabs ---------- */
  function renderTopbar() {
    const user = state.bootstrap.user;
    document.body.classList.toggle('is-admin', !!state.bootstrap.isAdmin);
    document.getElementById('userName').textContent = user.name;
    document.getElementById('userRole').textContent = state.bootstrap.isAdmin ? '管理者' : '申請者';
    const av = document.getElementById('userAvatar');
    av.textContent = initials(user.name);
    av.style.background = avColor(user.name);
    av.title = user.email;
  }

  async function refreshCounts() {
    try { state.counts = await gas('getTabCounts'); } catch (e) { /* counts are best-effort */ }
  }

  function renderTabs() {
    const admin = !!state.bootstrap.isAdmin;
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = '';
    TAB_DEFS.filter(t => !t.admin || admin).forEach(t => {
      const active = t.view === 'listView' ? (state.view === 'listView' && state.listMode === t.mode) : (state.view === t.view);
      const btn = document.createElement('button');
      btn.className = 'tab' + (active ? ' on' : '');
      const count = t.countKey ? state.counts[t.countKey] : null;
      btn.innerHTML = escapeHtml(t.label) + (typeof count === 'number' ? ' <span class="count">' + count + '</span>' : '');
      btn.addEventListener('click', () => {
        if (t.view === 'listView') { state.listMode = t.mode; }
        showView(t.view);
      });
      tabs.appendChild(btn);
    });
  }

  function showView(view) {
    state.view = view;
    if (view === 'formView') { renderForm(null); }
    else if (view === 'listView') { renderList(); }
    else if (view === 'adminView') { renderAdmin(); }
    renderTabs();
    window.scrollTo(0, 0);
  }

  /* ---------- 新規申請フォーム ---------- */
  function emptyItem() { return { name: '', model: '', maker: '', quantity: '', desiredDeliveryDate: '', note: '' }; }

  function uniqueSorted(values) {
    return Array.from(new Set(values.filter(Boolean))).sort((a, b) => String(a).localeCompare(String(b), 'ja'));
  }

  function deptSelectOptions(workers, selectedDept) {
    const depts = uniqueSorted(workers.map(w => w.dept));
    if (selectedDept && depts.indexOf(selectedDept) < 0) { depts.unshift(selectedDept); }
    return depts.map(d =>
      '<option value="' + escapeAttr(d) + '"' + (d === selectedDept ? ' selected' : '') + '>' + escapeHtml(d) + '</option>'
    ).join('');
  }

  function applicantSelectOptions(workers, dept, selectedName) {
    const names = uniqueSorted(workers.filter(w => w.dept === dept).map(w => w.name));
    if (selectedName && names.indexOf(selectedName) < 0) { names.unshift(selectedName); }
    if (names.length === 0) { return '<option value="">（該当者なし）</option>'; }
    return names.map(n =>
      '<option value="' + escapeAttr(n) + '"' + (n === selectedName ? ' selected' : '') + '>' + escapeHtml(n) + '</option>'
    ).join('');
  }

  function renderForm(draft) {
    const data = state.bootstrap;
    formState.editingId = draft ? draft.request.requestId : '';
    formState.requestDate = draft ? draft.request.requestDate : todayStr();
    formState.applicantName = draft ? draft.request.applicantName : data.user.name;
    formState.department = draft ? draft.request.department : (data.myApproverRule ? data.myApproverRule.department : '');
    formState.reasonCode = draft ? draft.request.reasonCode : '';
    formState.reasonDetail = draft ? draft.request.reasonDetail : '';
    formState.items = draft ? draft.items.map(it => ({
      name: it.name || '', model: it.model || '', maker: it.maker || '', quantity: it.quantity,
      desiredDeliveryDate: it.desiredDeliveryDate || '', note: it.note || ''
    })) : [emptyItem()];

    const editing = !!draft;
    const deptOptions = (data.departments || []).map(d => '<option value="' + escapeAttr(d) + '">').join('');
    const workers = (data.workers || []).filter(w => w && w.name);
    const useMaster = workers.length > 0;
    const applicantDeptCell = useMaster
      ? field('部署', true, '<select class="control" id="f-dept">' + deptSelectOptions(workers, formState.department) + '</select>')
      : field('部署', true, '<input class="control" type="text" id="f-dept" list="deptOptions" value="' + escapeAttr(formState.department) + '" maxlength="100"><datalist id="deptOptions">' + deptOptions + '</datalist>');
    const applicantNameCell = useMaster
      ? field('申請者', true, '<select class="control" id="f-applicant">' + applicantSelectOptions(workers, formState.department, formState.applicantName) + '</select>')
      : field('申請者', true, '<input class="control" type="text" id="f-applicant" value="' + escapeAttr(formState.applicantName) + '" readonly>');

    document.getElementById('main').innerHTML =
      '<div class="fade-in">' +
        '<div class="page-head">' +
          '<div class="title-wrap">' +
            '<span class="eyebrow">' + (editing ? 'Resubmit' : 'New Request') + '</span>' +
            '<h2>' + (editing ? '差戻し申請の修正' : '新規申請') + '</h2>' +
            '<span class="sub">必要事項を入力し、申請してください。金額は購買での確定後に決まります。</span>' +
          '</div>' +
          '<div class="head-actions"><button class="btn ghost" id="clearFormBtn">入力をクリア</button></div>' +
        '</div>' +

        '<div class="card"><div class="card-pad"><div class="grid-3">' +
          field('申請日', true, '<input class="control" type="date" id="f-date" value="' + escapeAttr(formState.requestDate) + '">') +
          applicantDeptCell +
          applicantNameCell +
        '</div></div></div>' +

        '<div class="card">' +
          '<div class="card-head"><h3>申請明細</h3><span class="hint">品名・数量・希望納期などを入力してください</span></div>' +
          '<div class="card-pad items-section">' +
            '<div class="icards" id="icards"></div>' +
            '<div style="margin-top:14px"><button class="btn sm" id="addItemBtn">＋ 明細行を追加</button></div>' +
          '</div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="card-head"><h3>購入理由</h3></div>' +
          '<div class="card-pad">' +
            '<div class="reasons" id="reasonCards"></div>' +
            '<div style="margin-top:16px">' +
              field('理由詳細', false, '<textarea class="control" id="f-reasonDetail" rows="3" maxlength="2000" placeholder="例）在庫が残り僅かのため補充します。">' + escapeHtml(formState.reasonDetail) + '</textarea>', '補足があれば記入してください（任意）') +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:18px">' +
          '<button class="btn lg primary" id="submitBtn">' + (editing ? '↻ 再申請する' : '➤ 申請する') + '</button>' +
        '</div>' +
      '</div>';

    document.getElementById('f-date').addEventListener('input', e => { formState.requestDate = e.target.value; });
    if (useMaster) {
      const deptSel = document.getElementById('f-dept');
      const applicantSel = document.getElementById('f-applicant');
      formState.department = deptSel.value;
      formState.applicantName = applicantSel.value;
      deptSel.addEventListener('change', e => {
        formState.department = e.target.value;
        applicantSel.innerHTML = applicantSelectOptions(workers, formState.department, '');
        formState.applicantName = applicantSel.value;
      });
      applicantSel.addEventListener('change', e => { formState.applicantName = e.target.value; });
    } else {
      document.getElementById('f-dept').addEventListener('input', e => { formState.department = e.target.value; });
    }
    document.getElementById('f-reasonDetail').addEventListener('input', e => { formState.reasonDetail = e.target.value; });
    document.getElementById('clearFormBtn').addEventListener('click', () => renderForm(null));
    document.getElementById('addItemBtn').addEventListener('click', () => { formState.items.push(emptyItem()); renderItemCards(); });
    document.getElementById('submitBtn').addEventListener('click', submitForm);
    renderReasonCards();
    renderItemCards();
  }

  function renderReasonCards() {
    const host = document.getElementById('reasonCards');
    host.innerHTML = state.bootstrap.reasons.map(r =>
      '<div class="reason' + (formState.reasonCode === r.code ? ' on' : '') + '" data-code="' + escapeAttr(r.code) + '">' +
        '<span class="rc">' + escapeHtml(r.code) + '</span><span class="rl">' + escapeHtml(r.label) + '</span></div>'
    ).join('');
    host.querySelectorAll('.reason').forEach(el => el.addEventListener('click', () => {
      formState.reasonCode = el.dataset.code;
      renderReasonCards();
    }));
  }

  function renderItemCards() {
    const host = document.getElementById('icards');
    host.innerHTML = formState.items.map((it, i) =>
      '<div class="icard" data-idx="' + i + '">' +
        '<div class="icard-top">' +
          '<span class="icard-no">' + (i + 1) + '</span>' +
          '<span style="font-weight:700;font-size:13px;color:var(--ink-soft)">明細 ' + (i + 1) + '</span>' +
          '<button class="row-del" data-del="' + i + '" style="margin-left:auto" title="削除">✕</button>' +
        '</div>' +
        '<div class="icard-grid">' +
          '<div><span class="mini-lbl">品名</span><input class="control" data-f="name" value="' + escapeAttr(it.name) + '" placeholder="品名" maxlength="200"></div>' +
          '<div><span class="mini-lbl">型式</span><input class="control" data-f="model" value="' + escapeAttr(it.model) + '" maxlength="200"></div>' +
          '<div><span class="mini-lbl">メーカー</span><input class="control" data-f="maker" value="' + escapeAttr(it.maker) + '" maxlength="200"></div>' +
          '<div class="sub">' +
            '<div><span class="mini-lbl">数量</span><input class="control num" data-f="quantity" type="number" min="0" value="' + escapeAttr(it.quantity) + '"></div>' +
            '<div><span class="mini-lbl">希望納期</span><input class="control" data-f="desiredDeliveryDate" type="date" value="' + escapeAttr(it.desiredDeliveryDate) + '"></div>' +
            '<div style="grid-column:1 / -1"><span class="mini-lbl">備考</span><input class="control" data-f="note" value="' + escapeAttr(it.note) + '" maxlength="500"></div>' +
          '</div>' +
        '</div>' +
      '</div>'
    ).join('');

    host.querySelectorAll('.icard').forEach(card => {
      const idx = Number(card.dataset.idx);
      card.querySelectorAll('input[data-f]').forEach(input => {
        input.addEventListener('input', () => {
          formState.items[idx][input.dataset.f] = input.value;
        });
      });
      card.querySelector('[data-del]').addEventListener('click', () => {
        formState.items.splice(idx, 1);
        if (formState.items.length === 0) { formState.items.push(emptyItem()); }
        renderItemCards();
      });
    });
  }

  async function submitForm() {
    if (!formState.reasonCode) { toast('購入理由を選択してください', 'err'); return; }
    if (!formState.items.some(it => it.name)) { toast('品名を1件以上入力してください', 'err'); return; }
    setBusy(true);
    try {
      const payload = {
        requestDate: formState.requestDate,
        applicantName: formState.applicantName,
        department: formState.department,
        reasonCode: formState.reasonCode,
        reasonDetail: formState.reasonDetail,
        items: formState.items
      };
      let detail;
      if (formState.editingId) {
        await gas('updateRequestDraft', formState.editingId, payload);
        detail = await gas('resubmitRequest', formState.editingId);
        toast('再申請しました', 'ok');
      } else {
        detail = await gas('createRequest', payload);
        toast('申請しました', 'ok');
      }
      await refreshCounts();
      await openDetail(detail.request.requestId);
    } catch (error) {
      toast(errText(error), 'err');
    } finally {
      setBusy(false);
    }
  }

  /* ---------- 一覧 ---------- */
  async function renderList() {
    const mode = state.listMode;
    const titleMap = { supervisor: '上席承認待ち', quote: '購買見積金額入力待ち', gm: '総務部長承認待ち', president: '社長承認待ち', arrange: '手配待ち', pending: '承認待ち', all: '全申請', mine: '自分の申請' };
    const eyebrow = { supervisor: 'Awaiting Supervisor', quote: 'Awaiting Quote', gm: 'Awaiting GM', president: 'Awaiting President', arrange: 'Awaiting Arrangement', pending: 'Awaiting Approval', all: 'All Requests', mine: 'My Requests' };
    const subMap = {
      supervisor: 'あなたが上席として承認すべき案件です（担当部署の案件のみ表示）。',
      quote: '購買が各明細の単価を入力する案件です。',
      gm: 'あなたが総務部長として承認すべき案件です。',
      president: '社長決裁を待っている案件です。タブレットで提示し、その場で承認・差戻しを記録できます。',
      arrange: '承認が完了し、購買が手配（発注）して「手配完了」を記録する案件です。',
      pending: 'あなたが動かすべき案件です。',
      all: '社内すべての申請を横断的に確認できます。',
      mine: '自分が申請した案件の進捗を確認できます。'
    };

    document.getElementById('main').innerHTML =
      '<div class="fade-in">' +
        '<div class="page-head"><div class="title-wrap">' +
          '<span class="eyebrow">' + (eyebrow[mode] || '') + '</span>' +
          '<h2>' + escapeHtml(titleMap[mode] || '申請一覧') + '</h2>' +
          '<span class="sub">' + escapeHtml(subMap[mode] || '') + '</span>' +
        '</div><div class="head-actions"><button class="btn" id="refreshBtn">↻ 更新</button></div></div>' +
        '<div id="statsHost"></div>' +
        '<div class="card">' +
          '<div class="card-pad" style="padding-bottom:14px"><div class="filters">' +
            '<div class="field"><span class="lbl">状態</span><div class="seg-filter" id="statusSeg">' +
              [['', 'すべて'], ['IN_REVIEW', '承認中'], ['RETURNED', '差戻し'], ['COMPLETED', '完了']].map(s =>
                '<button data-v="' + s[0] + '"' + (s[0] === '' ? ' class="on"' : '') + '>' + s[1] + '</button>').join('') +
            '</div></div>' +
            field('検索', false, '<input class="control" type="search" id="queryFilter" placeholder="申請番号・部署・申請者" style="min-width:220px">') +
          '</div></div>' +
          '<div class="table-wrap"><table class="tbl"><thead><tr>' +
            '<th>申請番号</th><th>申請日</th><th>申請者</th><th>部署</th><th class="r">確定金額</th><th>状態</th><th>現在ステップ</th><th></th>' +
          '</tr></thead><tbody id="listBody"><tr><td colspan="8"><div class="empty">読み込み中…</div></td></tr></tbody></table></div>' +
        '</div>' +
      '</div>';

    document.getElementById('refreshBtn').addEventListener('click', loadRows);
    document.getElementById('queryFilter').addEventListener('input', debounce(loadRows, 300));
    document.getElementById('statusSeg').querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      document.getElementById('statusSeg').querySelectorAll('button').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      loadRows();
    }));
    loadRows();
  }

  function currentStatusFilter() {
    const on = document.querySelector('#statusSeg button.on');
    return on ? on.dataset.v : '';
  }

  async function loadRows() {
    const body = document.getElementById('listBody');
    if (!body) { return; }
    try {
      const rows = await gas('getRequests', {
        mode: state.listMode,
        status: currentStatusFilter(),
        query: (document.getElementById('queryFilter') || {}).value || ''
      });
      renderStats(rows);
      renderRows(rows);
    } catch (error) {
      body.innerHTML = '<tr><td colspan="8"><div class="empty">' + escapeHtml(errText(error)) + '</div></td></tr>';
    }
  }

  function renderStats(rows) {
    const host = document.getElementById('statsHost');
    if (!host) { return; }
    const inReview = rows.filter(r => r.status === 'IN_REVIEW').length;
    const returned = rows.filter(r => r.status === 'RETURNED').length;
    const amount = rows.filter(r => r.status !== 'COMPLETED').reduce((t, r) => t + (r.totalAmount || 0), 0);
    const totalLabelMap = { supervisor: '上席承認待ち', quote: '見積金額入力待ち', gm: '総務部長承認待ち', president: '社長承認待ち', arrange: '手配待ち', pending: '要対応件数' };
    const totalLabel = totalLabelMap[state.listMode] || '件数';
    host.innerHTML =
      '<div class="stats">' +
        '<div class="stat"><div class="sl">' + totalLabel + '</div><div class="sv accent">' + rows.length + '</div><div class="su">件</div></div>' +
        '<div class="stat"><div class="sl">承認中</div><div class="sv">' + inReview + '</div><div class="su">件 進行中</div></div>' +
        '<div class="stat"><div class="sl">差戻し</div><div class="sv">' + returned + '</div><div class="su">件 要対応</div></div>' +
        '<div class="stat"><div class="sl">未完了金額</div><div class="sv num" style="font-size:21px">' + escapeHtml(yen(amount)) + '</div><div class="su">承認プロセス中</div></div>' +
      '</div>';
  }

  function renderRows(rows) {
    const body = document.getElementById('listBody');
    if (rows.length === 0) {
      body.innerHTML = '<tr><td colspan="8"><div class="empty">該当する申請はありません。</div></td></tr>';
      return;
    }
    const admin = !!state.bootstrap.isAdmin;
    body.innerHTML = rows.map(r => {
      const isQuote = r.currentStep === 'PURCHASING_QUOTE';
      const stepCell = r.status === 'COMPLETED'
        ? '<span style="color:var(--muted)">—</span>'
        : '<span style="display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap"><b>' + escapeHtml(r.currentStepLabel) + '</b>' +
          (r.currentApproverName ? '<span style="color:var(--muted)">' + escapeHtml(r.currentApproverName) + '</span>' : '') +
          (r.isPresidentPending ? '<span class="badge RETURNED" style="height:20px;font-size:10.5px"><span class="dot"></span>要提示</span>' : '') + '</span>';
      const action = (r.isPresidentPending && admin)
        ? '<button class="btn sm primary" data-pres="' + escapeAttr(r.requestId) + '">➤ 社長決裁</button>'
        : (isQuote && state.listMode === 'quote')
          ? '<button class="btn sm primary" data-open="' + escapeAttr(r.requestId) + '">✎ 金額入力</button>'
          : '<span style="color:var(--muted)">›</span>';
      return '<tr class="click" data-open="' + escapeAttr(r.requestId) + '">' +
        '<td><span class="reqid">' + escapeHtml(r.requestId) + '</span></td>' +
        '<td class="num" style="color:var(--muted)">' + escapeHtml(r.requestDate) + '</td>' +
        '<td><div class="who"><span class="av" style="background:' + avColor(r.applicantName) + '">' + escapeHtml(initials(r.applicantName)) + '</span><div><div class="nm">' + escapeHtml(r.applicantName) + '</div></div></div></td>' +
        '<td>' + escapeHtml(r.department) + '</td>' +
        '<td class="cell-amt">' + (r.totalAmount > 0 ? escapeHtml(yen(r.totalAmount)) : '未確定') + '</td>' +
        '<td>' + badge(r.status, currentStateLabel(r)) + '</td>' +
        '<td>' + stepCell + '</td>' +
        '<td style="text-align:right;white-space:nowrap">' + action + '</td>' +
      '</tr>';
    }).join('');

    body.querySelectorAll('tr[data-open]').forEach(tr => tr.addEventListener('click', () => openDetail(tr.dataset.open)));
    body.querySelectorAll('[data-pres]').forEach(btn => btn.addEventListener('click', e => {
      e.stopPropagation();
      openPresident(btn.dataset.pres);
    }));
  }

  /* ---------- 詳細 ---------- */
  async function openDetail(requestId) {
    setBusy(true);
    try {
      const detail = await gas('getRequestDetail', requestId);
      state.currentDetail = detail;
      state.view = 'detailView';
      renderDetail(detail);
      renderTabs();
      window.scrollTo(0, 0);
    } catch (error) {
      toast(errText(error), 'err');
    } finally {
      setBusy(false);
    }
  }

  function renderDetail(detail) {
    const r = detail.request;
    const p = detail.permissions;
    const over = (r.route || []).indexOf('PRESIDENT') !== -1;

    let html = '<div class="fade-in">';
    html += '<div class="page-head"><div class="title-wrap">' +
      '<span class="eyebrow">Request Detail</span>' +
      '<h2 style="display:flex;align-items:center;gap:12px"><span class="num" style="color:var(--primary)">' + escapeHtml(r.requestId) + '</span>' + badge(r.status, currentStateLabel(r)) + '</h2>' +
      '<span class="sub">' + escapeHtml(r.department) + '　/　申請者 ' + escapeHtml(r.applicantName) + '</span>' +
      '</div><div class="head-actions">' +
        '<button class="btn ghost" id="backBtn">‹ 一覧へ戻る</button>' +
        (r.pdfUrl ? '<a class="btn" href="' + escapeAttr(r.pdfUrl) + '" target="_blank" rel="noopener">⤓ PDFを開く</a>' : '') +
        (p.canGeneratePdf ? '<button class="btn" id="genPdfBtn">⤓ PDF再作成</button>' : '') +
        (p.canEdit ? '<button class="btn primary" id="editBtn">✎ 修正して再申請</button>' : '') +
      '</div></div>';

    html += '<div class="card"><div class="card-head"><h3>承認フロー</h3><span class="hint">' + (over ? '社長決裁ルート' : '標準ルート') + '</span></div>' +
      '<div class="stepper-card">' + stepperHtml(detail) + '</div></div>';

    const isArrange = r.currentStep === 'PURCHASING';
    const approveWord = isArrange ? '手配完了' : '承認する';

    // タブレット（全画面）CTAは上席・総務部長・社長のみ。見積／手配ステップでは出さない。
    if ((p.canTabletApprove || p.canPresident) && !p.canQuote && !p.canArrange) {
      const isPres = p.canPresident && !p.canApprove;
      const ctaTitle = isPres ? '社長決裁を受ける' : '全画面で確認して承認';
      const ctaDesc = isPres
        ? 'タブレットで申請書を提示し、その場で承認・差戻しを記録できます。'
        : '申請書を全画面で確認し、その場で承認・差戻しを記録できます。';
      const ctaBtn = isPres ? '➤ 社長決裁モードを開く' : '➤ 全画面で確認して承認';
      html += '<div class="president-cta"><div class="pc-l"><div class="pc-ic">▣</div><div class="pc-t">' +
        '<b>' + escapeHtml(ctaTitle) + '</b><div>' + escapeHtml(ctaDesc) + '</div></div></div>' +
        '<button class="btn primary lg" id="presBtn">' + escapeHtml(ctaBtn) + '</button></div>';
    }

    if (p.canQuote) {
      html += quotePanelHtml(detail);
    } else if (p.canArrange) {
      html += '<div class="approve-panel"><div class="ap-head">' +
        '<span class="badge IN_REVIEW"><span class="dot"></span>手配待ち</span>' +
        '<span class="pill">商品の発注・手配が完了したら手配完了を記録、またはコメント付きで差戻しできます</span></div>' +
        field('コメント', false, '<textarea class="control" id="approveComment" rows="3" maxlength="1000" placeholder="コメントを入力"></textarea>', '差戻しの場合は理由を記入してください') +
        '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px">' +
          '<button class="btn danger" id="returnBtn">‹ 差戻し</button>' +
          '<button class="btn primary lg" id="arrangeBtn">✓ 手配完了</button>' +
        '</div></div>';
    } else if (p.canApprove) {
      html += '<div class="approve-panel"><div class="ap-head">' +
        '<span class="badge IN_REVIEW"><span class="dot"></span>あなたの承認待ち</span>' +
        '<span class="pill">' + escapeHtml(stepLabel(r.currentStep)) + 'として承認またはコメント付きで差戻しできます</span></div>' +
        field('承認・差戻しコメント', false, '<textarea class="control" id="approveComment" rows="3" maxlength="1000" placeholder="コメントを入力"></textarea>', '差戻しの場合は理由を記入してください') +
        '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px">' +
          '<button class="btn danger" id="returnBtn">‹ 差戻し</button>' +
          '<button class="btn primary lg" id="approveBtn">✓ ' + escapeHtml(approveWord) + '</button>' +
        '</div></div>';
    }

    html += '<div class="card"><div class="card-pad"><div class="detail-grid">' +
      dcell('申請日', '<span class="num">' + escapeHtml(r.requestDate) + '</span>') +
      dcell('申請者', escapeHtml(r.applicantName)) +
      dcell('部署', escapeHtml(r.department)) +
      dcell('確定金額', '<span class="big">' + (r.totalAmount > 0 ? escapeHtml(yen(r.totalAmount)) : '未確定') + '</span>') +
      '<div class="dcell" style="grid-column:span 2"><div class="dl">購入理由</div><div class="dv">' + escapeHtml(r.reasonCode) + '. ' + escapeHtml(r.reasonLabel) + '</div></div>' +
      dcell('現在ステップ', escapeHtml(r.status === 'COMPLETED' ? '完了' : r.currentStepLabel)) +
      dcell('承認者', escapeHtml(r.currentApproverName || '—')) +
      '</div>' +
      (r.reasonDetail ? '<div style="margin-top:16px"><div class="dl" style="font-size:11px;color:var(--muted);font-weight:700;margin-bottom:6px">理由詳細</div>' +
        '<div style="padding:12px 14px;background:var(--surface-2);border-radius:var(--radius);font-size:13px;line-height:1.6;white-space:pre-wrap">' + escapeHtml(r.reasonDetail) + '</div></div>' : '') +
      '</div></div>';

    html += '<div class="card pdf-preview-card"><div class="pdf-preview-head"><div class="lhs"><div class="doc-ic"></div>' +
      '<div><h3>申請書（PDFフォーマット）</h3><div class="sub">保管・印刷用のモノクロ文書。Googleドライブに保存されます。</div></div></div>' +
      '<div class="head-actions">' + (p.canPresident ? '<button class="btn" id="presBtn2">➤ 社長に提示</button>' : '') + '</div></div>' +
      '<div class="pdf-preview-body"><div id="pdfPreviewWrap" style="width:100%;display:flex;justify-content:center"></div></div></div>';

    html += '<div class="card"><div class="card-head"><h3>申請明細</h3><span class="hint">' + detail.items.length + ' 件</span></div>' +
      '<div class="table-wrap"><table class="tbl"><thead><tr><th>品名</th><th>型式</th><th>メーカー</th><th class="r">数量</th><th class="r">単価</th><th class="r">金額</th><th>希望納期</th><th>備考</th></tr></thead><tbody>' +
      detail.items.map(it =>
        '<tr><td style="font-weight:600">' + escapeHtml(it.name) + '</td>' +
        '<td style="color:var(--muted)">' + escapeHtml(it.model || '—') + '</td>' +
        '<td style="color:var(--muted)">' + escapeHtml(it.maker || '—') + '</td>' +
        '<td class="cell-amt">' + escapeHtml(it.quantity) + '</td>' +
        '<td class="cell-amt">' + (it.unitPrice > 0 ? escapeHtml(yen(it.unitPrice)) : '未定') + '</td>' +
        '<td class="cell-amt">' + (it.amount > 0 ? escapeHtml(yen(it.amount)) : '未定') + '</td>' +
        '<td class="num" style="color:var(--muted)">' + escapeHtml(it.desiredDeliveryDate || '—') + '</td>' +
        '<td style="color:var(--muted)">' + escapeHtml(it.note || '—') + '</td></tr>'
      ).join('') +
      '</tbody><tfoot><tr><td colspan="5" class="r" style="font-weight:700;letter-spacing:.08em">合計</td>' +
      '<td class="cell-amt" style="font-size:15px">' + (r.totalAmount > 0 ? escapeHtml(yen(r.totalAmount)) : '未確定') + '</td>' +
      '<td colspan="2"></td></tr></tfoot></table></div></div>';

    html += '<div class="card"><div class="card-head"><h3>承認履歴</h3><span class="hint">' + detail.history.length + ' 件のアクション</span></div>' +
      '<div class="card-pad">' + historyHtml(detail.history) + '</div></div>';

    html += '</div>';
    document.getElementById('main').innerHTML = html;

    const bind = (id, fn) => { const el = document.getElementById(id); if (el) { el.addEventListener('click', fn); } };
    bind('backBtn', () => showView('listView'));
    bind('editBtn', () => renderForm(detail));
    bind('genPdfBtn', () => regeneratePdf(r.requestId));
    bind('presBtn', () => openTabletMode(r.requestId));
    bind('presBtn2', () => openTabletMode(r.requestId));
    bind('approveBtn', () => detailAction('approveRequest', isArrange ? '手配完了を記録しました' : '承認しました'));
    bind('arrangeBtn', () => detailAction('arrangeComplete', '手配完了を記録しました'));
    bind('returnBtn', () => detailAction('returnRequest', '差戻ししました'));

    if (p.canQuote) { bindQuotePanel(detail); }

    renderScaledPreview('pdfPreviewWrap', detail, {});
  }

  function dcell(label, valueHtml) {
    return '<div class="dcell"><div class="dl">' + escapeHtml(label) + '</div><div class="dv">' + valueHtml + '</div></div>';
  }

  async function detailAction(fn, message) {
    setBusy(true);
    try {
      const comment = (document.getElementById('approveComment') || {}).value || '';
      const detail = await gas(fn, state.currentDetail.request.requestId, comment);
      state.currentDetail = detail;
      await refreshCounts();
      renderDetail(detail);
      renderTabs();
      toast(message, 'ok');
      window.scrollTo(0, 0);
    } catch (error) {
      toast(errText(error), 'err');
    } finally {
      setBusy(false);
    }
  }

  /* ---------- 見積・金額入力（購買） ---------- */
  function quotePanelHtml(detail) {
    const rows = detail.items.map((it, i) =>
      '<tr data-qrow="' + i + '">' +
        '<td style="font-weight:600">' + escapeHtml(it.name) + '</td>' +
        '<td class="cell-amt">' + escapeHtml(it.quantity) + '</td>' +
        '<td><input class="control num q-unit" data-qidx="' + i + '" type="number" min="0" step="1" value="' + escapeAttr(it.unitPrice > 0 ? it.unitPrice : '') + '" placeholder="0"></td>' +
        '<td class="cell-amt q-amt" data-qamt="' + i + '">' + escapeHtml(yen(it.amount > 0 ? it.amount : 0)) + '</td>' +
      '</tr>'
    ).join('');
    return '<div class="approve-panel"><div class="ap-head">' +
      '<span class="badge RETURNED"><span class="dot"></span>見積・金額入力待ち</span>' +
      '<span class="pill">各明細の単価を入力して金額を確定、または見積不可・要修正としてコメント付きで差戻しできます</span></div>' +
      '<div class="card" style="margin:4px 0 6px"><div class="card-head"><h3>見積・金額入力</h3><span class="hint">単価を入力すると金額・合計が自動計算されます</span></div>' +
      '<div class="table-wrap"><table class="tbl"><thead><tr><th>品名</th><th class="r">数量</th><th class="r" style="width:160px">単価</th><th class="r" style="width:160px">金額</th></tr></thead>' +
      '<tbody>' + rows + '</tbody>' +
      '<tfoot><tr><td colspan="3" class="r" style="font-weight:700;letter-spacing:.08em">合計</td>' +
      '<td class="cell-amt" id="q-total" style="font-size:15px">' + escapeHtml(yen(detail.request.totalAmount > 0 ? detail.request.totalAmount : 0)) + '</td></tr></tfoot>' +
      '</table></div></div>' +
      field('コメント', false, '<textarea class="control" id="approveComment" rows="3" maxlength="1000" placeholder="コメントを入力"></textarea>', '差戻し（見積不可・要修正）の場合は理由を記入してください') +
      '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:12px">' +
        '<button class="btn danger" id="returnBtn">‹ 差戻し</button>' +
        '<button class="btn primary lg" id="quoteBtn">✓ 金額を確定</button>' +
      '</div></div>';
  }

  function bindQuotePanel(detail) {
    const recompute = () => {
      let total = 0;
      detail.items.forEach((it, i) => {
        const input = document.querySelector('.q-unit[data-qidx="' + i + '"]');
        const unit = input ? Number(input.value) : 0;
        const amount = (isFinite(unit) && unit >= 0 ? unit : 0) * Number(it.quantity || 0);
        total += amount;
        const cell = document.querySelector('[data-qamt="' + i + '"]');
        if (cell) { cell.textContent = yen(amount); }
      });
      const totalEl = document.getElementById('q-total');
      if (totalEl) { totalEl.textContent = yen(total); }
    };
    document.querySelectorAll('.q-unit').forEach(input => input.addEventListener('input', recompute));
    const btn = document.getElementById('quoteBtn');
    if (btn) { btn.addEventListener('click', () => confirmQuoteAction(detail)); }
  }

  async function confirmQuoteAction(detail) {
    const items = [];
    let total = 0;
    for (let i = 0; i < detail.items.length; i++) {
      const input = document.querySelector('.q-unit[data-qidx="' + i + '"]');
      const unitPrice = input ? Number(input.value) : NaN;
      if (!isFinite(unitPrice) || unitPrice < 0) {
        toast('すべての明細に0以上の単価を入力してください', 'err');
        return;
      }
      items.push({ itemId: detail.items[i].itemId, unitPrice: unitPrice });
      total += unitPrice * Number(detail.items[i].quantity || 0);
    }
    if (total <= 0) { toast('合計金額が0です。単価を入力してください', 'err'); return; }
    setBusy(true);
    try {
      const comment = (document.getElementById('approveComment') || {}).value || '';
      const updated = await gas('confirmQuote', state.currentDetail.request.requestId, items, comment);
      state.currentDetail = updated;
      await refreshCounts();
      renderDetail(updated);
      renderTabs();
      toast('見積金額を確定しました', 'ok');
      window.scrollTo(0, 0);
    } catch (error) {
      toast(errText(error), 'err');
    } finally {
      setBusy(false);
    }
  }

  async function regeneratePdf(requestId) {
    setBusy(true);
    try {
      const detail = await gas('generateRequestPdf', requestId);
      state.currentDetail = detail;
      renderDetail(detail);
      toast('PDFを作成しました', 'ok');
    } catch (error) {
      toast(errText(error), 'err');
    } finally {
      setBusy(false);
    }
  }

  /* ---------- 承認フロー（縦タイムライン） ---------- */
  function routeNodes(detail) {
    const r = detail.request;
    const keys = ['APPLICANT'].concat(r.route || []).concat(['DONE']);
    const completed = r.status === 'COMPLETED';
    let curIdx = completed ? keys.length - 1 : keys.indexOf(r.currentStep);
    if (curIdx < 0) { curIdx = 0; }
    return keys.map((key, i) => ({
      key,
      name: approverNameForStep(detail, key),
      state: completed ? 'done' : (i < curIdx ? 'done' : i === curIdx ? 'current' : 'pending')
    }));
  }

  function approverNameForStep(detail, key) {
    const r = detail.request;
    if (key === 'APPLICANT') { return r.applicantName; }
    if (key === 'DONE') { return ''; }
    if (key === r.currentStep && r.status !== 'COMPLETED') { return r.currentApproverName || ''; }
    const h = detail.history.slice().reverse().find(x => x.fromStep === key && (x.action === 'APPROVE' || x.action === 'COMPLETE' || x.action === 'RETURN' || x.action === 'QUOTE'));
    return h ? (h.actorName || '') : '';
  }

  function stepperHtml(detail) {
    const nodes = routeNodes(detail);
    return '<div class="step-t">' + nodes.map((n, i) => {
      const nextDone = i < nodes.length - 1 && (nodes[i + 1].state === 'done' || n.state === 'done');
      const avInner = n.key === 'DONE' ? '◎' : (n.state === 'done' ? '✓' : escapeHtml(initials(n.name)));
      const nameLine = n.name ? '<div class="t-name">' + escapeHtml(n.name) + '</div>' : (STEP_DESC[n.key] ? '<div class="t-name">' + escapeHtml(STEP_DESC[n.key]) + '</div>' : '');
      const tag = n.state === 'current' ? '<span class="t-tag">承認待ち</span>' : (n.state === 'done' && n.key !== 'DONE' ? '<span class="t-tag">完了</span>' : '');
      return '<div class="trow ' + n.state + '"><div class="rail"><div class="av">' + avInner + '</div>' +
        (i < nodes.length - 1 ? '<div class="bar' + (nextDone ? ' done' : '') + '"></div>' : '') + '</div>' +
        '<div class="tbody"><div class="t-lbl">' + escapeHtml(stepLabel(n.key)) + tag + '</div>' + nameLine + '</div></div>';
    }).join('') + '</div>';
  }

  function historyHtml(history) {
    if (!history.length) { return '<div class="empty">履歴はありません。</div>'; }
    return '<div class="history">' + history.slice().reverse().map(h => {
      const label = (state.bootstrap.actionLabels && state.bootstrap.actionLabels[h.action]) || h.actionLabel || h.action;
      return '<div class="hrow"><div class="hicon ' + escapeAttr(h.action) + '">' + (HIST_GLYPH[h.action] || '•') + '</div>' +
        '<div class="hbody"><div class="ht"><span class="ha">' + escapeHtml(label) + '</span>' +
        '<span class="hw">' + escapeHtml(h.actorName || h.actorEmail || '') + '</span>' +
        '<span class="htime">' + escapeHtml(h.happenedAt) + '</span></div>' +
        '<div class="hflow">' + escapeHtml(stepLabel(h.fromStep)) + ' › ' + escapeHtml(stepLabel(h.toStep)) + '</div>' +
        (h.comment ? '<div class="hcomment">' + escapeHtml(h.comment) + '</div>' : '') + '</div></div>';
    }).join('') + '</div>';
  }

  /* ---------- PDFドキュメント（モノクロA4・クライアント描画） ---------- */
  function pdfDocHtml(detail, opts) {
    const o = opts || {};
    const decision = o.variant === 'decision';
    const r = detail.request;
    const over = (r.route || []).indexOf('PRESIDENT') !== -1;
    const dateOnly = d => String(d || '').slice(0, 10);
    const stampKeys = ['APPLICANT'].concat(r.route || []);
    const wm = decision ? '' : (r.status === 'COMPLETED' ? '完了' : r.status === 'RETURNED' ? '差戻' : '');

    let html = '<div class="pdf-doc' + (decision ? ' pdf-doc--decision' : '') + '">';
    if (wm) { html += '<div class="wm">' + wm + '</div>'; }

    html += '<div class="masthead"><div class="mh-left">' +
      '<div class="mh-co">STORAGE SUPPLIES PURCHASE REQUEST</div>' +
      '<div class="mh-title">貯蔵品購入申請書</div>' +
      '<div class="mh-en">Storage Supplies Purchase Request</div></div>' +
      '<div class="mh-right"><div class="mh-no">' + escapeHtml(r.requestId) + '</div>' +
      '<div class="mh-date">申請日 <b>' + escapeHtml(dateOnly(r.requestDate)) + '</b></div>' +
      '<div class="mh-date">区分 ' + (over ? '社長決裁' : '通常決裁') + '</div></div></div>' +
      '<div class="rule-heavy"></div><div class="rule-thin"></div>';

    if (!decision) {
      html += '<div class="kessai"><div class="kessai-lbl">決 裁 欄　APPROVAL</div><div class="stamps">' +
        stampKeys.map(key => {
          const st = stampFor(detail, key);
          if (st) {
            const ng = st.kind === 'ng' ? ' ng' : '';
            return '<div class="stamp acted' + ng + '"><div class="s-role">' + escapeHtml(stepLabel(key)) + '</div>' +
              '<div class="dnstamp">' +
                '<div class="dn-name" style="font-size:' + nameFont(st.name) + '">' + escapeHtml(st.name) + '</div>' +
                '<div class="dn-date">' + escapeHtml(eraDate(st.date)) + '</div>' +
                '<div class="dn-role">' + escapeHtml(stampTitle(detail, key)) + '</div>' +
              '</div></div>';
          }
          const pendName = approverNameForStep(detail, key);
          return '<div class="stamp"><div class="s-role">' + escapeHtml(stepLabel(key)) + '</div>' +
            '<div class="s-empty"></div><div class="s-pending">' + escapeHtml(pendName || '—') + '</div></div>';
        }).join('') + '</div></div>';
    }

    html += '<div class="meta">' +
      mcell('部署', escapeHtml(r.department)) +
      mcell('申請者', escapeHtml(r.applicantName)) +
      '<div class="mcell wide"><div class="mk">メールアドレス</div><div class="mv mono" style="font-size:8.4pt">' + escapeHtml(r.applicantEmail) + '</div></div>' +
      mcell('明細件数', '<span class="mono">' + detail.items.length + ' 件</span>') +
      mcell('状態', escapeHtml(r.statusLabel)) +
      '<div class="mcell wide" style="border-right:0"><div class="mk">合計金額（税込）</div><div class="mv amt">' + (r.totalAmount > 0 ? escapeHtml(yen(r.totalAmount)) : '未確定') + '</div></div>' +
      '</div>';

    html += '<div class="sec-head"><span class="sq"></span><h2>申請明細</h2><span class="sline"></span><span class="scount">' + detail.items.length + ' ITEMS</span></div>' +
      '<table class="items"><thead><tr>' +
      '<th style="width:5%">No.</th><th style="width:32%">品名 / 型式・メーカー</th><th class="r" style="width:8%">数量</th>' +
      '<th class="r" style="width:13%">単価</th><th class="r" style="width:14%">金額</th>' +
      '<th style="width:14%">希望納期</th><th>備考</th></tr></thead><tbody>' +
      detail.items.map((it, i) =>
        '<tr><td class="no">' + (i + 1) + '</td>' +
        '<td><div class="nm">' + escapeHtml(it.name) + '</div><div class="sub">' + escapeHtml([it.model, it.maker].filter(Boolean).join('・') || '—') + '</div></td>' +
        '<td class="r">' + escapeHtml(it.quantity) + '</td>' +
        '<td class="r">' + (it.unitPrice > 0 ? escapeHtml(yen(it.unitPrice)) : '未定') + '</td>' +
        '<td class="r">' + (it.amount > 0 ? escapeHtml(yen(it.amount)) : '未定') + '</td>' +
        '<td class="mono" style="font-size:8pt">' + escapeHtml(dateOnly(it.desiredDeliveryDate) || '—') + '</td>' +
        '<td style="font-size:8pt;color:var(--gray)">' + escapeHtml(it.note || '—') + '</td></tr>'
      ).join('') +
      '</tbody><tfoot><tr><td colspan="4" class="tl">合計金額（税込）</td>' +
      '<td class="tv">' + (r.totalAmount > 0 ? escapeHtml(yen(r.totalAmount)) : '未確定') + '</td>' +
      '<td colspan="2"></td></tr></tfoot></table>';

    html += '<div class="sec-head"><span class="sq"></span><h2>購入理由</h2><span class="sline"></span></div><div class="reasons-grid">' +
      state.bootstrap.reasons.map(x =>
        '<div class="rz' + (r.reasonCode === x.code ? ' on' : '') + '"><span class="chk">' + (r.reasonCode === x.code ? '✓' : '') + '</span>' +
        '<span><b>' + escapeHtml(x.code) + '.</b> ' + escapeHtml(x.label) + '</span></div>'
      ).join('') + '</div>' +
      '<div class="reason-detail"><div class="rd-k">理由詳細</div>' + escapeHtml(r.reasonDetail || '—') + '</div>';

    if (!decision) {
      html += '<div class="sec-head"><span class="sq"></span><h2>承認履歴</h2><span class="sline"></span><span class="scount">' + detail.history.length + ' LOGS</span></div>' +
        '<table class="hist"><thead><tr><th style="width:17%">日時</th><th style="width:11%">処理</th><th style="width:17%">担当</th><th style="width:22%">ステップ</th><th>コメント</th></tr></thead><tbody>' +
        detail.history.map(h => {
          const label = (state.bootstrap.actionLabels && state.bootstrap.actionLabels[h.action]) || h.actionLabel || h.action;
          return '<tr><td class="mono">' + escapeHtml(h.happenedAt) + '</td><td>' + escapeHtml(label) + '</td>' +
            '<td>' + escapeHtml(h.actorName || h.actorEmail || '') + '</td>' +
            '<td class="mono" style="font-size:7.4pt">' + escapeHtml(stepLabel(h.fromStep)) + ' → ' + escapeHtml(stepLabel(h.toStep)) + '</td>' +
            '<td style="color:var(--ink-2)">' + escapeHtml(h.comment || '—') + '</td></tr>';
        }).join('') + '</tbody></table>' +
        '<div class="doc-foot">' + barcodeHtml(r.requestId) +
        '<div class="foot-meta"><div class="fm-id">' + escapeHtml(r.requestId) + '</div>' +
        '<div>本書は貯蔵品購入申請システムにより発行された電磁的記録です。</div></div></div>';
    }

    html += '</div>';
    return html;
  }

  function mcell(k, vHtml) { return '<div class="mcell"><div class="mk">' + escapeHtml(k) + '</div><div class="mv">' + vHtml + '</div></div>'; }

  function stampFor(detail, key) {
    if (key === 'APPLICANT') {
      const h = detail.history.slice().reverse().find(x => x.action === 'SUBMIT' || x.action === 'RESUBMIT');
      return h ? { name: h.actorName, date: h.happenedAt, kind: 'apply' } : null;
    }
    const h = detail.history.slice().reverse().find(x => x.fromStep === key && (x.action === 'APPROVE' || x.action === 'COMPLETE' || x.action === 'RETURN' || x.action === 'QUOTE'));
    if (!h) { return null; }
    return { name: h.actorName, date: h.happenedAt, kind: h.action === 'RETURN' ? 'ng' : 'approve' };
  }

  function barcodeHtml(seed) {
    let h = 7;
    const s = String(seed);
    let bars = '';
    for (let i = 0; i < 46; i++) {
      h = (h * 31 + (s.charCodeAt(i % s.length) || 13)) >>> 0;
      const w = (1 + (h % 3)) * 1.1;
      bars += '<i style="width:' + w.toFixed(2) + 'px;opacity:' + (i % 7 === 0 ? '0.35' : '1') + '"></i>';
    }
    return '<div class="barcode">' + bars + '</div>';
  }

  /* スケール済みプレビュー（A4を縮小表示） */
  function renderScaledPreview(hostId, detail, opts) {
    const wrap = document.getElementById(hostId);
    if (!wrap) { return; }
    const maxScale = (opts && opts.maxScale) || 0.62;
    wrap.innerHTML = '<div style="overflow:hidden"><div class="pdf-scaler" style="transform:scale(' + maxScale + ')">' + pdfDocHtml(detail, opts) + '</div></div>';
    const measure = () => {
      const cw = wrap.clientWidth;
      const scaler = wrap.querySelector('.pdf-scaler');
      const holder = wrap.firstElementChild;
      if (!scaler || !holder) { return; }
      const scale = Math.min(maxScale, cw / 793.7);
      scaler.style.transform = 'scale(' + scale + ')';
      const docEl = scaler.firstElementChild;
      const dh = docEl ? docEl.offsetHeight : 1122;
      holder.style.height = (dh * scale) + 'px';
    };
    measure();
    setTimeout(measure, 160);
    if (renderScaledPreview._handler) { window.removeEventListener('resize', renderScaledPreview._handler); }
    renderScaledPreview._handler = measure;
    window.addEventListener('resize', measure);
  }

  /* ---------- 全画面承認モード（社長決裁・上席ほか現承認者） ---------- */
  const pmodeState = { detail: null, phase: 'view', comment: '', chips: [], canApprove: false, canPresident: false };

  // 一覧の「社長決裁」ボタン互換: 社長決裁ステップ限定で開く。
  async function openPresident(requestId) {
    return openTabletMode(requestId);
  }

  async function openTabletMode(requestId) {
    setBusy(true);
    try {
      const detail = await gas('getRequestDetail', requestId);
      const p = detail.permissions || {};
      if (!p.canApprove && !p.canPresident) {
        toast('この案件を承認できる権限がありません。', 'err');
        return;
      }
      pmodeState.detail = detail;
      pmodeState.phase = 'view';
      pmodeState.comment = '';
      pmodeState.chips = [];
      pmodeState.canApprove = !!p.canApprove;
      pmodeState.canPresident = !!p.canPresident;
      renderPmode();
    } catch (error) {
      toast(errText(error), 'err');
    } finally {
      setBusy(false);
    }
  }

  function closePresident(reload) {
    document.getElementById('pmodeRoot').innerHTML = '';
    pmodeState.detail = null;
    if (reload) {
      refreshCounts().then(renderTabs);
      if (state.view === 'listView') { loadRows(); }
      else if (state.view === 'detailView' && state.currentDetail) { openDetail(state.currentDetail.request.requestId); }
    }
  }

    const stepLbl = r.currentStepLabel || stepLabel(r.currentStep);
    const kicker = isPres ? '社長決裁モード' : (stepLbl + ' モード');
    const approveWord = isPurchasing ? '手配完了' : '承認する';
    const approveSmall = isPres ? '社長決裁' : (isPurchasing ? '発注手配' : stepLbl);

    let actions = '';
    if (pmodeState.phase === 'view') {
      const prompt = isPurchasing ? 'この申請の手配が完了しましたか？' : 'この申請を承認してよろしいでしょうか？';
      actions = '<div class="pmode-actions"><div class="pmode-prompt"><span class="pp-dot"></span>' + escapeHtml(prompt) + '</div>' +
        '<div class="pmode-btns">' +
          '<button class="pbtn ng" id="pmNg"><span class="pbtn-ic">✕</span><span><b>差し戻す</b><small>NG・要修正</small></span></button>' +
          '<button class="pbtn ok" id="pmOk"><span class="pbtn-ic">✓</span><span><b>' + escapeHtml(approveWord) + '</b><small>' + escapeHtml(approveSmall) + '</small></span></button>' +
        '</div></div>';
    }

    let sheet = '';
    if (pmodeState.phase === 'confirm-approve') {
      const sheetTitle = isPurchasing ? 'この申請の手配を完了します' : 'この申請を承認します';
      const sheetSub = isPurchasing ? '記録後、総務部へ通知されます。' : (isPres ? '承認後、購買へ進みます。' : '承認後、次のステップへ進みます。');
      const confirmWord = isPurchasing ? '手配完了を確定' : '承認を確定';
      sheet = '<div class="pmode-sheet"><div class="psheet-card"><div class="psheet-icon ok">✓</div>' +
        '<h3>' + escapeHtml(sheetTitle) + '</h3><p class="psheet-sub">' + escapeHtml(r.requestId) + '・' + (r.totalAmount > 0 ? escapeHtml(yen(r.totalAmount)) : '未確定') + '<br>' + escapeHtml(sheetSub) + '</p>' +
        '<input class="psheet-input" id="pmComment" placeholder="コメント（任意）" value="' + escapeAttr(pmodeState.comment) + '">' +
        '<div class="psheet-btns"><button class="pbtn2 ghost" id="pmBack">戻る</button><button class="pbtn2 ok" id="pmConfirmOk">' + escapeHtml(confirmWord) + '</button></div></div></div>';
    } else if (pmodeState.phase === 'confirm-return') {
      sheet = '<div class="pmode-sheet"><div class="psheet-card"><div class="psheet-icon ng">✕</div>' +
        '<h3>この申請を差し戻します</h3><p class="psheet-sub">理由を選択または入力してください（申請者へ通知されます）。</p>' +
        '<div class="psheet-chips">' + NG_REASONS.map(c => '<button class="pchip' + (pmodeState.chips.indexOf(c) >= 0 ? ' on' : '') + '" data-chip="' + escapeAttr(c) + '">' + escapeHtml(c) + '</button>').join('') + '</div>' +
        '<textarea class="psheet-input" id="pmComment" rows="2" placeholder="補足コメント">' + escapeHtml(pmodeState.comment) + '</textarea>' +
        '<div class="psheet-btns"><button class="pbtn2 ghost" id="pmBack">戻る</button><button class="pbtn2 ng" id="pmConfirmNg">差戻しを確定</button></div></div></div>';
    } else if (pmodeState.phase === 'done-approve' || pmodeState.phase === 'done-return') {
      const ok = pmodeState.phase === 'done-approve';
      const doneTitle = ok ? (isPurchasing ? '手配完了を記録しました' : '承認しました') : '差し戻しました';
      const doneSub = ok
        ? (isPurchasing ? '総務部へ通知されました。記録に残りました。' : '次のステップへ進みます。記録に残りました。')
        : '申請者へ通知されました。';
      sheet = '<div class="pmode-sheet"><div class="psheet-card"><div class="psheet-icon ' + (ok ? 'ok' : 'ng') + '">' + (ok ? '✓' : '✕') + '</div>' +
        '<h3>' + escapeHtml(doneTitle) + '</h3>' +
        '<p class="psheet-sub">' + escapeHtml(doneSub) + '</p>' +
        '<div class="psheet-btns"><button class="pbtn2 ok" id="pmCloseDone">閉じる</button></div></div></div>';
    }

    root.innerHTML = '<div class="pmode">' +
      '<div class="pmode-bar"><div class="pmode-bar-l"><span class="pmode-kicker">' + escapeHtml(kicker) + '</span>' +
        '<span class="pmode-id mono">' + escapeHtml(r.requestId) + '</span>' +
        '<span class="pmode-meta">' + escapeHtml(r.applicantName) + '（' + escapeHtml(r.department) + '）</span></div>' +
        '<div class="pmode-bar-r"><div class="pmode-amt"><span class="pa-l">確定金額</span><span class="pa-v mono">' + (r.totalAmount > 0 ? escapeHtml(yen(r.totalAmount)) : '未確定') + '</span></div>' +
        '<button class="pmode-close" id="pmClose">閉じる ✕</button></div></div>' +
      '<div class="pmode-stage" id="pmStage"><div class="pmode-paper" id="pmPaper"><div class="pmode-paper-inner" id="pmPaperInner">' + pdfDocHtml(detail, { variant: 'decision' }) + '</div></div></div>' +
      actions + sheet + '</div>';

    fitPaper();
    bindPmode();
  }

  function fitPaper() {
    const stage = document.getElementById('pmStage');
    const paper = document.getElementById('pmPaper');
    const inner = document.getElementById('pmPaperInner');
    if (!stage || !paper || !inner) { return; }
    const availW = stage.clientWidth - 52;
    const availH = stage.clientHeight - 44;
    const scale = Math.max(0.2, Math.min(availW / 793.7, availH / 1122.5));
    paper.style.width = (793.7 * scale) + 'px';
    paper.style.height = (1122.5 * scale) + 'px';
    inner.style.transform = 'scale(' + scale + ')';
  }

  function bindPmode() {
    const bind = (id, fn) => { const el = document.getElementById(id); if (el) { el.addEventListener('click', fn); } };
    bind('pmClose', () => closePresident(false));
    bind('pmNg', () => { pmodeState.phase = 'confirm-return'; renderPmode(); });
    bind('pmOk', () => { pmodeState.phase = 'confirm-approve'; renderPmode(); });
    bind('pmBack', () => { pmodeState.phase = 'view'; renderPmode(); });
    bind('pmConfirmOk', () => decidePresident('approve'));
    bind('pmConfirmNg', () => decidePresident('return'));
    bind('pmCloseDone', () => closePresident(true));
    const cmt = document.getElementById('pmComment');
    if (cmt) { cmt.addEventListener('input', e => { pmodeState.comment = e.target.value; }); }
    document.querySelectorAll('#pmodeRoot [data-chip]').forEach(b => b.addEventListener('click', () => {
      const c = b.dataset.chip;
      const idx = pmodeState.chips.indexOf(c);
      if (idx >= 0) { pmodeState.chips.splice(idx, 1); } else { pmodeState.chips.push(c); }
      renderPmode();
    }));
    if (!fitPaper._bound) {
      window.addEventListener('resize', () => { if (pmodeState.detail) { fitPaper(); } });
      fitPaper._bound = true;
    }
  }

  async function decidePresident(decision) {
    const detail = pmodeState.detail;
    const r = detail.request;
    const isPurchasing = r.currentStep === 'PURCHASING';
    let comment = pmodeState.comment;
    if (decision === 'return') {
      comment = [pmodeState.chips.join('、'), pmodeState.comment].filter(Boolean).join(' / ');
      if (!comment) { toast('差戻し理由を選択または入力してください', 'err'); return; }
    }
    setBusy(true);
    try {
      let updated;
      if (pmodeState.canApprove) {
        // ログインユーザー自身が現承認者（上席・総務部長・購買 等）。
        updated = decision === 'approve'
          ? await gas('approveRequest', r.requestId, comment)
          : await gas('returnRequest', r.requestId, comment);
      } else {
        // 管理者が社長の代理として決裁を記録。
        updated = await gas('recordPresidentDecision', r.requestId, decision, comment);
      }
      pmodeState.detail = updated;
      pmodeState.phase = decision === 'approve' ? 'done-approve' : 'done-return';
      renderPmode();
      const okMsg = pmodeState.canApprove
        ? (decision === 'approve' ? (isPurchasing ? '手配完了を記録しました' : '承認しました') : '差戻ししました')
        : '社長決裁の結果を記録しました';
      toast(okMsg, 'ok');
    } catch (error) {
      toast(errText(error), 'err');
    } finally {
      setBusy(false);
    }
  }

  const APPROVER_FIELDS = ['department', 'applicantEmail', 'applicantName', 'supervisorEmail', 'supervisorName', 'supervisorTitle', 'generalManagerEmail', 'generalManagerName', 'generalManagerTitle', 'presidentEmail', 'presidentName', 'presidentTitle', 'purchasingEmail', 'purchasingName', 'purchasingTitle'];

  function addApproverRow(row) {
    row = row || {};
    const body = document.getElementById('approverBody');
    const tr = document.createElement('tr');
    const placeholders = { department: '* で全体', applicantEmail: '空欄=部署単位' };
    tr.innerHTML = APPROVER_FIELDS.map(f => {
      const type = f.toLowerCase().indexOf('email') >= 0 ? 'email' : 'text';
      const phText = placeholders[f] || (/Title$/.test(f) ? '役職（任意・例:部長）' : '');
      const ph = phText ? ' placeholder="' + escapeAttr(phText) + '"' : '';
      return '<td><input class="iinput" data-field="' + f + '" type="' + type + '" value="' + escapeAttr(row[f] || '') + '"' + ph + '></td>';
    }).join('') +
      '<td style="text-align:center"><input data-field="active" type="checkbox"' + (row.active === false ? '' : ' checked') + ' style="width:18px;height:18px"></td>' +
      '<td><button class="row-del" type="button">✕</button></td>';
    tr.querySelector('.row-del').addEventListener('click', () => tr.remove());
    body.appendChild(tr);
  }

  async function saveAdmin() {
    setBusy(true);
    try {
      const settings = {
        thresholdAmount: document.getElementById('a-threshold').value,
        pdfFolderId: document.getElementById('a-folder').value,
        adminEmails: document.getElementById('a-admins').value,
        enableEmailNotifications: document.getElementById('a-notify').checked
      };
      const rows = Array.from(document.querySelectorAll('#approverBody tr')).map(tr => {
        const obj = {};
        tr.querySelectorAll('[data-field]').forEach(input => {
          obj[input.dataset.field] = input.type === 'checkbox' ? input.checked : input.value;
        });
        return obj;
      });
      const recipientRows = Array.from(document.querySelectorAll('#recipientBody tr')).map(tr => {
        const obj = {};
        tr.querySelectorAll('[data-field]').forEach(input => {
          obj[input.dataset.field] = input.type === 'checkbox' ? input.checked : input.value;
        });
        return obj;
      }).filter(row => row.email);
      await gas('saveApproverMaster', rows);
      await gas('saveNotificationRecipients', recipientRows);
      state.bootstrap = await gas('saveSettings', settings);
      renderTopbar();
      renderAdmin();
      toast('管理設定を保存しました', 'ok');
    } catch (error) {
      toast(errText(error), 'err');
    } finally {
      setBusy(false);
    }
  }

  async function runSample(fn, confirmMsg) {
    if (!window.confirm(confirmMsg)) { return; }
    setBusy(true);
    try {
      const result = await gas(fn);
      state.bootstrap = await gas('getBootstrap');
      await refreshCounts();
      toast((result && result.message) || '完了しました', 'ok');
      state.listMode = 'all';
      showView('listView');
    } catch (error) {
      toast(errText(error), 'err');
    } finally {
      setBusy(false);
    }
  }

  /* ---------- 共通UI ---------- */
  function field(label, required, controlHtml, hint) {
    return '<label class="field"><span class="lbl">' + escapeHtml(label) + (required ? '<span class="req">必須</span>' : '') + '</span>' +
      controlHtml + (hint ? '<span class="hint">' + escapeHtml(hint) + '</span>' : '') + '</label>';
  }
  function badge(status, label) { return '<span class="badge ' + escapeAttr(status) + '"><span class="dot"></span>' + escapeHtml(label || status) + '</span>'; }
  function stepLabel(key) { return (state.bootstrap.stepLabels && state.bootstrap.stepLabels[key]) || key || ''; }
  // 一覧・詳細の状態バッジ表示用。色クラスは r.status のまま、テキストだけ分かりやすく。
  function currentStateLabel(r) {
    if (r.status === 'RETURNED') { return '差戻し'; }
    if (r.status === 'COMPLETED') { return '完了'; }
    const byStep = {
      SUPERVISOR: '上席承認待ち',
      PURCHASING_QUOTE: '見積金額待ち',
      GENERAL_MANAGER: '総務部長承認待ち',
      PRESIDENT: '社長承認待ち',
      PURCHASING: '手配待ち'
    };
    return byStep[r.currentStep] || r.currentStepLabel || '';
  }
  function threshold() { return Number((state.bootstrap.settings || {}).thresholdAmount) || 100000; }
  function surname(name) { return String(name || '').trim().split(/\s+/)[0] || ''; }
  // データネーム印の中央帯（元号年.月.日）。例: 2026-05-27 → 令8. 5. 27
  function eraDate(value) {
    const s = String(value || '').slice(0, 10);
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (!m) { return ''; }
    const y = Number(m[1]);
    const n = y - 2018;
    const era = n >= 1 ? ('令' + n) : String(y % 100);
    return era + '. ' + Number(m[2]) + '. ' + Number(m[3]);
  }
  // 決裁印の下段。承認者マスタの役職があればそれを、無ければ役割名。
  function stampTitle(detail, key) {
    const t = detail.stepTitles && detail.stepTitles[key];
    return t ? t : stepLabel(key);
  }
  // 印面に収まるよう文字数で氏名フォントを縮小。
  function nameFont(name) {
    const n = String(name || '').replace(/\s+/g, '').length;
    if (n <= 2) { return '9pt'; }
    if (n === 3) { return '7.6pt'; }
    return '6.4pt';
  }

  /* ---------- 基盤ヘルパー ---------- */
  function gas(name) {
    const args = Array.prototype.slice.call(arguments, 1);
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => reject(err && err.message ? err.message : err));
      runner[name].apply(runner, args);
    });
  }

  function toast(msg, kind) {
    const host = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast ' + (kind || '');
    el.innerHTML = '<span class="tdot"></span>' + escapeHtml(msg);
    host.appendChild(el);
    setTimeout(() => { el.remove(); }, 3200);
  }

  function setBusy(busy) {
    document.getElementById('loading').hidden = !busy;
  }

  function errText(error) { return (error && error.message) ? error.message : String(error); }

  function yen(value) {
    return new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 }).format(Number(value || 0));
  }

  function initials(name) {
    if (!name) { return '—'; }
    const parts = String(name).trim().split(/\s+/);
    return (parts[0] || '')[0] + (parts[1] ? parts[1][0] : '');
  }
  const AV_COLORS = ['#0e6f60', '#4250d6', '#9a4b3f', '#b06a12', '#2f4a6b', '#7a3f86', '#0f7b8a', '#385c2e'];
  function avColor(seed) {
    let h = 0;
    const s = String(seed);
    for (let i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return AV_COLORS[h % AV_COLORS.length];
  }

  function todayStr() { return new Date().toISOString().slice(0, 10); }

  function escapeHtml(value) {
    return String(value === null || value === undefined ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }

  function debounce(fn, wait) {
    let timer = null;
    return function () {
      const args = arguments;
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(null, args), wait);
    };
  }
</script>
