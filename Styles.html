<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&family=Noto+Serif+JP:wght@500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ===== 貯蔵品購入申請 リデザイン — B案「ゆとり」（藍ベース） ===== */
  :root {
    --bg: #f4f5fb;
    --surface: #ffffff;
    --surface-2: #f7f8fd;
    --ink: #1b2138;
    --ink-soft: #3a4263;
    --muted: #727a98;
    --line: #e4e7f2;
    --line-soft: #eef0f7;
    --primary: #4250d6;
    --primary-strong: #3540ad;
    --primary-tint: #ebedfc;
    --accent: #c2497f;
    --header-bg: #ffffff;
    --header-ink: #1b2138;
    --header-sub: #727a98;
    --ok: #1f9d57;
    --ok-tint: #e6f6ec;
    --warn: #d08214;
    --warn-tint: #fcefd9;
    --info: #4250d6;
    --info-tint: #ebedfc;
    --radius: 12px;
    --radius-lg: 18px;
    --shadow: 0 1px 2px rgba(40, 46, 90, .05);
    --shadow-card: 0 6px 24px -12px rgba(40, 46, 90, .22);
    --font-head: 'Noto Sans JP', system-ui, sans-serif;
    --font-body: 'Noto Sans JP', system-ui, sans-serif;
    --font-num: 'Roboto Mono', ui-monospace, monospace;
    --head-weight: 700;
    --pad: 28px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { background-color: var(--bg); }

  body {
    background-color: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4 { margin: 0; font-family: var(--font-head); line-height: 1.28; font-weight: var(--head-weight); letter-spacing: .01em; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }
  a { color: inherit; }

  .num { font-family: var(--font-num); font-feature-settings: "tnum"; }

  /* ---------- App shell ---------- */
  .shell { min-height: 100vh; display: flex; flex-direction: column; }

  /* トップバー＋タブを上部に固定し、スクロールはその下から */
  .appbar {
    position: sticky; top: 0; z-index: 100;
    background: var(--bg);
    box-shadow: 0 8px 18px -14px rgba(40, 46, 90, .35);
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 0 28px; height: 64px;
    background: var(--header-bg); color: var(--header-ink);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 9px; flex: none;
    display: grid; place-items: center; font-family: var(--font-head); font-weight: 800; font-size: 17px;
    background: var(--primary); color: #fff;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
  .brand-text .co { font-size: 11px; letter-spacing: .14em; color: var(--header-sub); }
  .brand-text .ti { font-size: 16px; font-weight: 700; font-family: var(--font-head); }

  .topbar-right { display: flex; align-items: center; gap: 14px; }
  /* 社内ポータルへ戻る（参照リポジトリと同仕様の緑ボタン） */
  .portal-link {
    font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 8px;
    border: 1px solid var(--ok); background: var(--ok); color: #fff;
    text-decoration: none; white-space: nowrap; line-height: 1; transition: background .15s;
  }
  .portal-link:hover { background: #177a43; border-color: #177a43; color: #fff; }
  .userbox { display: flex; align-items: center; gap: 10px; }
  .avatar {
    width: 34px; height: 34px; border-radius: 50%; flex: none; display: grid; place-items: center;
    font-weight: 700; font-size: 13px; color: #fff; background: var(--accent);
  }
  .userbox .meta { display: flex; flex-direction: column; line-height: 1.2; text-align: right; }
  .userbox .meta .n { font-weight: 700; font-size: 13px; }
  .userbox .meta .e { font-size: 11px; color: var(--header-sub); }

  /* ---------- Tabs ---------- */
  .tabs {
    display: flex; flex-wrap: nowrap; gap: 6px; padding: 8px 24px 0; background: transparent;
    border-bottom: 1px solid var(--line);
    overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .tab {
    position: relative; border: 0; background: transparent; color: var(--muted);
    padding: 14px 16px; font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 8px;
    border-radius: 10px 10px 0 0;
    white-space: nowrap; flex: 0 0 auto;
  }
  .tab .count {
    display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 999px; font-size: 11px; font-family: var(--font-num);
    background: var(--line-soft); color: var(--muted);
  }
  .tab:hover { color: var(--ink-soft); }
  .tab.on { color: var(--primary); background: var(--surface); }
  .tab.on .count { background: var(--primary-tint); color: var(--primary); }
  .tab.on::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2.5px;
    background: var(--primary); border-radius: 3px 3px 0 0;
  }
  /* 新規申請を主役に（左・塗りボタン）／承認・処理系は右寄せ・淡色で副次 */
  .tab-spacer { flex: 1 1 auto; min-width: 12px; }
  .tab-grouplabel { align-self: center; white-space: nowrap; font-size: 11px; font-weight: 700; letter-spacing: .08em; color: var(--muted); padding: 0 8px 8px 12px; border-left: 1px solid var(--line); }
  .tab.tab-primary { background: var(--primary); color: #fff; border-radius: 10px; padding: 9px 18px; margin: 6px 6px 8px 0; }
  .tab.tab-primary:hover { color: #fff; filter: brightness(1.08); }
  .tab.tab-primary.on::after { display: none; }
  .tab.tab-sub { font-size: 12.5px; padding: 14px 12px; opacity: .92; }
  .tab.tab-sub:not(.on) { color: var(--muted); }

  /* ---------- Main ---------- */
  .main { flex: 1; width: min(1320px, calc(100vw - 40px)); margin: 0 auto; padding: 26px 0 60px; }

  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; margin-bottom: 18px; }
  /* 管理画面: タイトル＋保存を appbar 直下に固定（top は JS で appbar の高さに合わせる） */
  /* 上の固定バー直下に密着させ、スクロール開始時から完全固定（margin-top で .main の上余白26pxを相殺） */
  .admin-sticky-head { position: sticky; top: 0; z-index: 50; background: var(--bg); padding: 18px 0 14px; margin: -26px 0 6px; border-bottom: 1px solid var(--line-soft); }
  .admin-sticky-head .page-head { margin-bottom: 0; }
  .page-head .title-wrap { display: flex; flex-direction: column; gap: 4px; }
  .page-head .eyebrow { font-size: 11px; letter-spacing: .16em; color: var(--muted); text-transform: uppercase; font-weight: 700; }
  .page-head h2 { font-size: 23px; }
  .page-head .sub { color: var(--muted); font-size: 13px; }
  .head-actions { display: flex; gap: 10px; }

  /* ---------- Card ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
  }
  .card + .card { margin-top: 18px; }
  .card-pad { padding: var(--pad); }
  .card-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px var(--pad); border-bottom: 1px solid var(--line-soft);
  }
  .card-head h3 { font-size: 15px; }
  .card-head .hint { font-size: 12px; color: var(--muted); }

  /* ---------- Buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 7px; justify-content: center;
    min-height: 38px; padding: 0 16px; border-radius: var(--radius);
    border: 1px solid var(--line); background: var(--surface); color: var(--ink-soft);
    font-weight: 700; font-size: 13px; transition: all .16s ease; white-space: nowrap; text-decoration: none;
  }
  .btn:hover { border-color: var(--muted); color: var(--ink); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover { background: var(--primary-strong); border-color: var(--primary-strong); color: #fff; }
  .btn.ghost { background: transparent; }
  .btn.danger { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .btn.danger:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .btn.sm { min-height: 32px; padding: 0 11px; font-size: 12.5px; }
  .btn.lg { min-height: 46px; padding: 0 22px; font-size: 14.5px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* ---------- Fields ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field > .lbl { font-size: 12px; font-weight: 700; color: var(--ink-soft); display: flex; gap: 6px; align-items: center; }
  .field .req { color: var(--accent); font-size: 11px; }
  .field .hint { font-size: 11px; color: var(--muted); }
  .control {
    width: 100%; min-height: 40px; border: 1px solid var(--line); border-radius: var(--radius);
    padding: 9px 11px; background: var(--surface); color: var(--ink); transition: border-color .15s, box-shadow .15s;
  }
  .control:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-tint); }
  .control::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
  .control[readonly] { background: var(--surface-2); color: var(--muted); }
  textarea.control { resize: vertical; min-height: 84px; line-height: 1.6; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }

  /* ---------- Badges ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px;
    border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap;
  }
  .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .badge.IN_REVIEW { background: var(--info-tint); color: var(--info); }
  .badge.RETURNED { background: var(--warn-tint); color: var(--warn); }
  .badge.COMPLETED { background: var(--ok-tint); color: var(--ok); }
  .badge.CANCELLED { background: var(--surface-2); color: var(--muted); }
  .badge.soft { background: var(--surface-2); color: var(--muted); }

  /* ---------- Tables (一覧) ---------- */
  .table-wrap { width: 100%; overflow-x: auto; }
  table.tbl { width: 100%; border-collapse: collapse; }
  table.tbl th {
    text-align: left; font-size: 11px; letter-spacing: .04em; color: var(--muted); font-weight: 700;
    padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: transparent;
  }
  table.tbl td { padding: 14px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
  table.tbl tr:last-child td { border-bottom: 0; }
  table.tbl tbody tr.click { cursor: pointer; transition: background .14s; }
  table.tbl tbody tr.click:hover { background: var(--surface-2); }
  .reqid { font-family: var(--font-num); font-weight: 700; font-size: 13px; color: var(--primary); }
  .cell-amt { font-family: var(--font-num); font-weight: 700; text-align: right; }
  th.r, td.r { text-align: right; }
  .empty { padding: 48px; text-align: center; color: var(--muted); }

  /* who cell */
  .who { display: flex; align-items: center; gap: 9px; }
  .who .av { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; flex: none; }
  .who .nm { font-weight: 600; font-size: 13px; }
  .who .dp { font-size: 11px; color: var(--muted); }

  /* ---------- 明細テーブル（B案：行カード） ---------- */
  .items-section { margin-top: 4px; }
  .icards { display: flex; flex-direction: column; gap: 12px; }
  .icard { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--surface-2); }
  .icard-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .icard-no { width: 26px; height: 26px; border-radius: 8px; background: var(--primary-tint); color: var(--primary); display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; font-size: 12px; flex: none; }
  .icard-grid { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
  .icard-grid .sub { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; grid-column: 1 / -1; }
  .icard .mini-lbl { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 4px; display: block; }
  .icard .line-amt-b { margin-left: auto; font-family: var(--font-num); font-weight: 800; font-size: 16px; }
  .control.num { text-align: right; font-family: var(--font-num); }
  /* 明細カードの単位（「その他」選択時の自由入力欄はセレクトの直下に出す） */
  .icard .unit-free { margin-top: 6px; }
  /* 見積パネル：単価入力の右に単位を添え、何あたりの単価かを購買に明示する */
  .q-unit-wrap { display: flex; align-items: center; gap: 6px; }
  .q-unit-wrap .q-unit { flex: 1; min-width: 0; }
  .q-unit-suffix { font-size: 12px; color: var(--muted); white-space: nowrap; font-weight: 600; }
  .row-del { width: 30px; height: 30px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; flex: none; }
  .row-del:hover { color: var(--accent); border-color: var(--accent); }

  .items-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 16px; margin-top: 8px; border-top: 2px solid var(--line); flex-wrap: wrap; }
  .total-box { display: flex; align-items: baseline; gap: 12px; }
  .total-box .tl { font-size: 12px; color: var(--muted); font-weight: 700; }
  .total-box .tv { font-family: var(--font-num); font-weight: 800; font-size: 26px; color: var(--primary); }
  .threshold-note { font-size: 12px; color: var(--muted); }
  .threshold-note.over { color: var(--accent); font-weight: 700; }

  /* reasons */
  .reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .reason {
    display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line);
    border-radius: var(--radius); cursor: pointer; transition: all .14s; background: var(--surface);
  }
  .reason:hover { border-color: var(--muted); }
  .reason.on { border-color: var(--primary); background: var(--primary-tint); }
  .reason .rc { width: 24px; height: 24px; border-radius: 7px; flex: none; display: grid; place-items: center; font-family: var(--font-head); font-weight: 800; font-size: 13px; background: var(--surface-2); color: var(--ink-soft); }
  .reason.on .rc { background: var(--primary); color: #fff; }
  .reason .rl { font-size: 12.5px; line-height: 1.5; }

  /* ---------- 品目区分セグメント ---------- */
  .cat-seg { display: flex; gap: 10px; flex-wrap: wrap; }
  .cat-opt {
    flex: 1 1 0; min-width: 120px; padding: 12px 16px; border: 1px solid var(--line);
    border-radius: var(--radius); cursor: pointer; transition: all .14s; background: var(--surface);
    font-family: var(--font-head); font-weight: 700; font-size: 14px; color: var(--ink-soft); text-align: center;
  }
  .cat-opt:hover { border-color: var(--muted); }
  .cat-opt.on { border-color: var(--primary); background: var(--primary-tint); color: var(--primary); }

  /* 一覧・詳細で品目区分を一目で示すバッジ */
  .cat-chip { display: inline-flex; align-items: center; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 1.7; border: 1px solid transparent; white-space: nowrap; }
  .cat-chip.MECH { color: #1d4ed8; background: rgba(37,99,235,.12); border-color: rgba(37,99,235,.32); }
  .cat-chip.ELEC { color: #b45309; background: rgba(208,130,20,.16); border-color: rgba(208,130,20,.42); }
  .cat-chip.GENERAL { color: var(--muted); background: var(--surface-2); border-color: var(--line); }

  /* ---------- Stepper（B案：縦タイムライン） ---------- */
  .stepper-card { padding: var(--pad); }
  .step-t { display: flex; flex-direction: column; }
  .step-t .trow { display: flex; gap: 14px; }
  .step-t .rail { display: flex; flex-direction: column; align-items: center; flex: none; }
  .step-t .av { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: var(--muted); flex: none; }
  .step-t .trow.done .av { background: var(--primary); }
  .step-t .trow.current .av { background: var(--primary); box-shadow: 0 0 0 4px var(--primary-tint); }
  .step-t .trow.pending .av { background: var(--surface-2); color: var(--muted); border: 2px solid var(--line); }
  .step-t .bar { width: 2px; flex: 1; min-height: 22px; background: var(--line); }
  .step-t .bar.done { background: var(--primary); }
  .step-t .tbody { padding-bottom: 18px; }
  .step-t .trow:last-child .tbody { padding-bottom: 0; }
  .step-t .t-lbl { font-weight: 700; font-size: 13.5px; }
  .step-t .t-name { font-size: 12px; color: var(--muted); }
  .step-t .t-tag { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; margin-left: 8px; }
  .step-t .trow.current .t-tag { background: var(--primary-tint); color: var(--primary); }
  .step-t .trow.done .t-tag { background: var(--ok-tint); color: var(--ok); }

  /* ---------- Detail ---------- */
  .detail-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line-soft); border: 1px solid var(--line-soft); border-radius: var(--radius); overflow: hidden; }
  .dcell { background: var(--surface); padding: 14px 16px; }
  .dcell .dl { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 5px; }
  .dcell .dv { font-size: 14px; font-weight: 600; }
  .dcell .dv.big { font-family: var(--font-num); font-size: 18px; font-weight: 800; }

  .approve-panel { margin-top: 18px; padding: var(--pad); border: 1px solid var(--primary); border-radius: var(--radius-lg); background: var(--primary-tint); }
  .approve-panel .ap-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .approve-panel .ap-head .pill { font-size: 12px; font-weight: 700; color: var(--primary); }

  /* 差し戻し時の注記 */
  .return-notice { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 14px; padding: 12px 14px; border: 1px solid var(--warn); background: var(--warn-tint); border-radius: var(--radius); }
  .return-notice .rn-ic { font-size: 16px; line-height: 1.5; flex: none; }
  .return-notice .rn-body { font-size: 12.5px; line-height: 1.7; color: #7a5510; }
  .return-notice .rn-body b { display: block; margin-bottom: 2px; color: var(--warn); font-size: 12px; letter-spacing: .04em; }
  .psheet-notice { font-size: 12px; line-height: 1.6; color: #7a5510; background: var(--warn-tint); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 12px; margin-bottom: 14px; text-align: left; }

  /* 承認時の注意事項（責任・代理押印禁止） */
  .approver-notice { margin: 4px 0 14px; padding: 12px 14px; border: 1.5px solid var(--warn); background: var(--warn-tint); border-radius: var(--radius); }
  .approver-notice .an-head { font-weight: 800; color: var(--warn); font-size: 13px; margin-bottom: 6px; letter-spacing: .02em; }
  .approver-notice .an-list { margin: 0; padding-left: 18px; font-size: 12.5px; line-height: 1.7; color: #7a5510; }
  .approver-notice .an-list li { margin: 2px 0; }

  .history { display: flex; flex-direction: column; }
  .hrow { display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line-soft); }
  .hrow:last-child { border-bottom: 0; }
  .hicon { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; color: #fff; font-weight: 700; }
  .hicon.SUBMIT, .hicon.RESUBMIT { background: var(--info); }
  .hicon.APPROVE { background: var(--ok); }
  .hicon.RETURN { background: var(--warn); }
  .hicon.COMPLETE { background: var(--primary); }
  .hicon.UPDATE, .hicon.PDF_GENERATE { background: var(--muted); }
  .hicon.ESCALATE { background: var(--accent); }
  .hbody { flex: 1; }
  .hbody .ht { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .hbody .ha { font-weight: 700; font-size: 13.5px; }
  .hbody .hw { font-size: 12px; color: var(--muted); }
  .hbody .htime { font-size: 11px; color: var(--muted); font-family: var(--font-num); margin-left: auto; }
  .hbody .hflow { font-size: 12px; color: var(--ink-soft); margin-top: 3px; }
  .hbody .hcomment { margin-top: 6px; padding: 9px 12px; background: var(--surface-2); border-radius: var(--radius); font-size: 12.5px; line-height: 1.55; border-left: 3px solid var(--line); white-space: pre-wrap; }

  /* ---------- Filters ---------- */
  .filters { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .filters .field { min-width: 160px; }
