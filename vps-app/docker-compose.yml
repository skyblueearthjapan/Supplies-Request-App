# 貯蔵品購入申請 VPS 版（srv1508169 の /opt/chozouhin/vps-app で動かす）
# - ホスト側にポートを出さない。外からは cloudflared（Tunnel）→ web だけ。
# - コンテナ名・ネットワーク・ボリュームは chozouhin- で始め、同居するほかのアプリと重ねない。
# - 秘密は .env（権限 600、git に入れない）。見本は .env.example。
name: chozouhin

x-api-env: &api-env
  APP_ENV: ${APP_ENV}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
  GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
  SESSION_SECRET: ${SESSION_SECRET}
  SESSION_MAX_AGE_DAYS: ${SESSION_MAX_AGE_DAYS:-14}
  ALLOWED_DOMAIN: ${ALLOWED_DOMAIN}
  BOOTSTRAP_ADMINS: ${BOOTSTRAP_ADMINS}
  FERNET_KEY: ${FERNET_KEY}
  DELEGATE_EMAIL: ${DELEGATE_EMAIL}
  MAIL_REDIRECT_TO: ${MAIL_REDIRECT_TO:-}
  PROD_PDF_FOLDER_ID: ${PROD_PDF_FOLDER_ID:-}
  STAGING_SPREADSHEET_ID: ${STAGING_SPREADSHEET_ID:-}
  STAGING_PDF_FOLDER_ID: ${STAGING_PDF_FOLDER_ID:-}
  EXPORT_HOURLY_UNTIL: ${EXPORT_HOURLY_UNTIL:-}
  TZ: Asia/Tokyo

services:
  db:
    image: postgres:16-alpine
    container_name: chozouhin-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Tokyo
      PGTZ: Asia/Tokyo
    volumes:
      - chozouhin-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [chozouhin-net]

  api:
    build:
      context: ./api
    image: chozouhin-app:${APP_IMAGE_TAG:-latest}
    container_name: chozouhin-api
    restart: unless-stopped
    environment: *api-env
    depends_on:
      db:
        condition: service_healthy
    networks: [chozouhin-net]

  worker:
    image: chozouhin-app:${APP_IMAGE_TAG:-latest}
    container_name: chozouhin-worker
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    healthcheck:
      disable: true
    depends_on:
      api:
        condition: service_healthy
    networks: [chozouhin-net]

  web:
    image: nginx:1.27-alpine
    container_name: chozouhin-web
    restart: unless-stopped
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/static:/usr/share/nginx/html:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [chozouhin-net]

  cloudflared:
    image: cloudflare/cloudflared:2024.12.2
    container_name: chozouhin-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      web:
        condition: service_healthy
    networks: [chozouhin-net]

  backup:
    image: postgres:16-alpine
    container_name: chozouhin-backup
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: Asia/Tokyo
    volumes:
      - ${BACKUPS_HOST_PATH:-./backups}:/backups
      - ./backup/backup_entrypoint.sh:/usr/local/bin/backup_entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup_entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks: [chozouhin-net]

volumes:
  chozouhin-pgdata:
    name: chozouhin-pgdata

networks:
  chozouhin-net:
    name: chozouhin-net
    driver: bridge
