# 貯蔵品購入申請 VPS 版の web（nginx）。
# 公式 nginx イメージの /etc/nginx/conf.d/default.conf に置く想定（http{} の中に読み込まれる）。
# - 画面（static/）をそのまま配る
# - /api/ と /auth/（と /healthz）を api コンテナ（FastAPI, :8000）へ中継する
# - 入口は Cloudflare Tunnel（cloudflared → http://web:80）。TLS は Cloudflare で終わる。

map $http_x_forwarded_proto $chozouhin_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# 利用者の IP。入口は Cloudflare Tunnel だけ（ホストにポートを出さない）なので、Cloudflare が付ける
# CF-Connecting-IP を使う（無いとき＝コンテナの中からの確認は、つないできた相手の IP）。
map $http_cf_connecting_ip $chozouhin_client_ip {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

log_format chozouhin '$chozouhin_client_ip - $remote_user [$time_local] "$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent" rt=$request_time';

# /api/ の回数制限。社内は同じ IP（会社の出口）からの利用が多いので緩め（1 秒 10 回、バースト 30）。
limit_req_zone $chozouhin_client_ip zone=chozouhin_api:10m rate=10r/s;
limit_req_status 429;

upstream chozouhin_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;
    access_log /var/log/nginx/access.log chozouhin;

    # RPC の JSON と管理画面の保存だけなので小さくてよい。
    client_max_body_size 2m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- セキュリティヘッダ ----
    # location の中で add_header を使うと、ここの add_header が引き継がれなくなる（nginx の仕様）。
    # そのため location の中では add_header を使わず、キャッシュは expires で指定する。
    #
    # CSP で許す外部ドメインは Google Fonts だけ（Styles の @import 相当の <link>）。
    # QR コードの生成ライブラリは /vendor/ に同梱しているので外部の script は無い。
    # 画面の JS は /app.js に分けてあり、インラインの script・onclick などは使わない（script-src は 'self' だけ）。
    # style-src の 'unsafe-inline' は、画面が style 属性を多く使うため。
    # frame-ancestors 'self': ほかのサイトへの埋め込みを許さない（ポータルからはリンクで開くだけ）。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---- 画面 ----
    location = / {
        # 画面を直したらすぐ届くよう、index.html は毎回確かめさせる。
        expires -1;
        try_files /index.html =404;
    }
    location = /index.html {
        expires -1;
    }
    location = /app.js {
        # index.html と同じく、画面を直したらすぐ届くよう毎回確かめさせる。
        expires -1;
    }
    location /vendor/ {
        # ファイル名に版を含めているので長めに持たせてよい。
        expires 7d;
        try_files $uri =404;
    }

    # ---- サーバー（FastAPI）へ中継 ----
    location /api/ {
        limit_req zone=chozouhin_api burst=30 nodelay;
        proxy_pass http://chozouhin_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $chozouhin_client_ip;
        proxy_set_header X-Forwarded-For $chozouhin_client_ip;
        proxy_set_header X-Forwarded-Proto $chozouhin_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
    location /auth/ {
        proxy_pass http://chozouhin_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $chozouhin_client_ip;
        proxy_set_header X-Forwarded-For $chozouhin_client_ip;
        proxy_set_header X-Forwarded-Proto $chozouhin_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }
    location = /healthz {
        proxy_pass http://chozouhin_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $chozouhin_client_ip;
        proxy_set_header X-Forwarded-For $chozouhin_client_ip;
        proxy_set_header X-Forwarded-Proto $chozouhin_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
        proxy_buffering on;
    }

    # 上に無い URL は画面へ（?requestId= 付きの古いリンクも / で開く）。
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
